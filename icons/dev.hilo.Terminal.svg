<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3044"/>
      <stop offset="1" stop-color="#151925"/>
    </linearGradient>
    <linearGradient id="hilo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc861"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#shine)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <!-- prompt -->
  <polyline points="28,52 46,66 28,80" fill="none" stroke="#e8ecf5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- hilo: baja con un lazo y termina en el cursor -->
  <path d="M104 26 C 84 22, 70 30, 72 42 C 74 54, 94 54, 94 42 C 94 32, 76 32, 76 48 C 76 62, 82 72, 82 84"
        fill="none" stroke="url(#hilo)" stroke-width="5" stroke-linecap="round"/>
  <!-- cursor -->
  <rect x="62" y="84" width="40" height="13" rx="4" fill="url(#hilo)"/>
</svg>
